<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
    <style>
      .box { fill: #f5f7ff; stroke: #5c6bc0; stroke-width: 1.5; rx: 8; }
      .box-app { fill: #e8f5e9; stroke: #43a047; }
      .box-shared { fill: #fff3e0; stroke: #fb8c00; }
      .box-api { fill: #ede7f6; stroke: #7e57c2; }
      .box-impl { fill: #e3f2fd; stroke: #1e88e5; }
      .box-core { fill: #fafafa; stroke: #757575; }
      .label { font-size: 13px; fill: #212121; text-anchor: middle; dominant-baseline: middle; }
      .label-sm { font-size: 11px; fill: #424242; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #5c6bc0; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 18px; font-weight: 600; fill: #212121; text-anchor: middle; }
      .legend { font-size: 11px; fill: #616161; }
    </style>
  </defs>

  <text x="460" y="28" class="title">Module graph</text>

  <!-- androidApp -->
  <rect x="390" y="48" width="140" height="36" class="box box-app"/>
  <text x="460" y="66" class="label">:androidApp</text>

  <!-- shared -->
  <rect x="330" y="118" width="260" height="40" class="box box-shared"/>
  <text x="460" y="138" class="label">:shared</text>

  <!-- feature impl -->
  <rect x="40" y="210" width="200" height="40" class="box box-impl"/>
  <text x="140" y="230" class="label">:feature:characters:impl</text>

  <rect x="280" y="210" width="170" height="40" class="box box-impl"/>
  <text x="365" y="230" class="label">:feature:episode:impl</text>

  <rect x="490" y="210" width="180" height="40" class="box box-impl"/>
  <text x="580" y="230" class="label">:feature:location:impl</text>

  <!-- feature api -->
  <rect x="40" y="310" width="200" height="40" class="box box-api"/>
  <text x="140" y="330" class="label">:feature:characters:api</text>

  <rect x="280" y="310" width="170" height="40" class="box box-api"/>
  <text x="365" y="330" class="label">:feature:episode:api</text>

  <rect x="490" y="310" width="180" height="40" class="box box-api"/>
  <text x="580" y="330" class="label">:feature:location:api</text>

  <!-- core -->
  <rect x="710" y="210" width="180" height="140" class="box box-core"/>
  <text x="800" y="236" class="label">:core:*</text>
  <text x="800" y="258" class="label-sm">common</text>
  <text x="800" y="276" class="label-sm">network</text>
  <text x="800" y="294" class="label-sm">database</text>
  <text x="800" y="312" class="label-sm">designsystem</text>
  <text x="800" y="330" class="label-sm">image</text>

  <!-- edges top -->
  <path d="M460 84 L460 118" class="edge"/>
  <path d="M140 198 L140 210" class="edge"/>
  <path d="M365 198 L365 210" class="edge"/>
  <path d="M580 198 L580 210" class="edge"/>
  <path d="M520 158 L800 210" class="edge"/>

  <!-- impl -> api -->
  <path d="M140 250 L140 310" class="edge"/>
  <path d="M365 250 L365 310" class="edge"/>
  <path d="M580 250 L580 310" class="edge"/>

  <!-- cross-feature api deps -->
  <path d="M140 350 L365 330" class="edge"/>
  <path d="M140 350 L580 330" class="edge"/>

  <!-- impl -> core -->
  <path d="M240 230 L710 260" class="edge"/>
  <path d="M450 230 L710 270" class="edge"/>
  <path d="M670 230 L710 280" class="edge"/>

  <!-- legend -->
  <rect x="40" y="400" width="14" height="14" class="box box-impl"/>
  <text x="62" y="408" class="legend" text-anchor="start">impl  data, UI, DI</text>
  <rect x="220" y="400" width="14" height="14" class="box box-api"/>
  <text x="242" y="408" class="legend" text-anchor="start">api  domain + repository interfaces</text>
  <text x="460" y="470" class="label-sm">Cross-feature deps use api modules only (compile-time boundary).</text>
</svg>
