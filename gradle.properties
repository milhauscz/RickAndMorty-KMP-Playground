#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Project coordinates. Single source of truth for the version: the published SDK artifacts, the app's
#versionName and the git tag the release job creates all derive from VERSION_NAME, so there is no way
#for them to drift apart. Bump it according to docs/api-compatibility.md.
GROUP=cz.cernilovsky.kmp.rickandmorty
VERSION_NAME=0.3.0
PROJECT_URL=https://gitlab.com/milhauscz-mobile/RickAndMorty-KMP-Playground/
