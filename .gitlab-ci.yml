# GitLab CI pipeline for merge-request checks and automated releases.
# NOTE: This configuration has not been run on GitLab yet — it documents the intended CI/CD
# workflow and may need tweaks (runner image, signing) before first use.

default:
  image: cernilovsky/android-kmp:jdk17
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/

# Pipeline types: merge request verification, development release, and manual runs from the
# GitLab UI (Run pipeline). Everything else gets no pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "development"'

stages:
  - lint
  - test
  - build
  - release

# Quality gate for merge requests and manual web runs. A push to development skips straight to
# the release stage instead of repeating it.
.verify:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

lint:
  extends: .verify
  stage: lint
  script:
    - ./gradlew lintKotlin detekt :konsist:test

test:
  extends: .verify
  stage: test
  script:
    # Root-level task (no module prefix) runs host tests across every module, not just :shared.
    - ./gradlew testAndroidHostTest
  artifacts:
    when: on_failure
    paths:
      - "**/build/test-results/testAndroidHostTest/*.xml"
    reports:
      junit: "**/build/test-results/testAndroidHostTest/*.xml"
    expire_in: 30 days

build:
  extends: .verify
  stage: build
  script:
    - ./gradlew :androidApp:assembleDebug
  artifacts:
    paths:
      - androidApp/build/outputs/apk/debug/*.apk
    expire_in: 7 days

# Builds the release APK and derives the release tag from androidApp/build.gradle.kts'
# versionName, passing both to publish-release via a dotenv artifact.
release:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  script:
    - ./gradlew :androidApp:assembleRelease
    - VERSION=$(grep 'versionName' androidApp/build.gradle.kts | sed -E 's/.*versionName *= *"([^"]+)".*/\1/')
    - |
      cat <<EOF >> release.env
      TAG=v$VERSION
      RELEASE_JOB_ID=$CI_JOB_ID
      EOF
  artifacts:
    paths:
      - androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
    reports:
      dotenv: release.env
    expire_in: 30 days

# Creates the GitLab Release (release-cli creates the git tag) and links the APK from release.
publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  needs:
    - job: release
      artifacts: true
  script:
    - echo "Publishing $TAG for $CI_COMMIT_SHORT_SHA"
  release:
    tag_name: '$TAG'
    description: 'Automated release $TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'androidApp-release-unsigned.apk'
          url: '${CI_PROJECT_URL}/-/jobs/${RELEASE_JOB_ID}/artifacts/raw/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk'
