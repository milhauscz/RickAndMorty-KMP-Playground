# GitLab CI pipeline for merge-request checks and automated releases.
#
# The reusable parts live in `templates/` as CI components and this file consumes them from its own
# project — the same way an unrelated project would, only pinned to the commit under test rather than
# to a released version.
#
# `@$CI_COMMIT_SHA` resolves the component from this commit, so a change to a template is tested by
# the pipeline of the merge request that makes it. A consuming project pins a released version
# instead: `@1.0.0`.
include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/base@$CI_COMMIT_SHA
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gradle-quality@$CI_COMMIT_SHA
    inputs:
      stage: lint
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gradle-test@$CI_COMMIT_SHA
    inputs:
      stage: test
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/android-build@$CI_COMMIT_SHA
    inputs:
      stage: build
      build-type: debug
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/ios-build@$CI_COMMIT_SHA
    inputs:
      stage: build
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/release@$CI_COMMIT_SHA
    inputs:
      stage: release
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/sbom@$CI_COMMIT_SHA
    inputs:
      stage: release
