spec:
  inputs:
    lint-job-name:
      default: lint
      description: Name of the lint job, so the component can be included more than once.
    stage:
      default: lint
      description: Stage to run in. Must exist in the including pipeline's `stages`.
    gradle-args:
      default: lintKotlin detekt :konsist:test checkKotlinAbi
      description: >-
        Tasks to run. The default is the full gate: formatting, static analysis, architecture rules,
        and the public API check. Unqualified task names run in every module that has them.
    changelog-job-name:
      default: changelog
      description: Name of the job that verifies the version in gradle.properties has a changelog section.
    changelog-script:
      default: ./scripts/changelog-section.sh
      description: >-
        Script that extracts a version's changelog section. The same script is used by the release
        component when building release notes; this job fails early if the section is missing.
---

# Static analysis and release-readiness gate. The lint job answers questions a reviewer would
# otherwise have to answer by reading: is it formatted, does it violate a rule we agreed on, does it
# cross a module boundary, and did the published API change without its dump being updated? The
# changelog job uses the same script as the release component to ensure VERSION_NAME has a section in
# CHANGELOG.md before a merge request lands or a release pipeline is triggered manually.
"$[[ inputs.lint-job-name ]]":
  extends: .mrJobRules
  stage: $[[ inputs.stage ]]
  script:
    - ./gradlew $[[ inputs.gradle-args ]]
  artifacts:
    when: on_failure
    paths:
      - "**/build/reports/detekt/**"
    reports:
      junit: "konsist/build/test-results/test/*.xml"
    expire_in: 30 days

"$[[ inputs.changelog-job-name ]]":
  extends: .mrJobRules
  stage: $[[ inputs.stage ]]
  before_script: []
  cache: []
  script:
    - $[[ inputs.changelog-script ]] > /dev/null
