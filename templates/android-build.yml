spec:
  inputs:
    job-name:
      default: build
      description: Name of the generated job, so debug and release builds can coexist.
    stage:
      default: build
      description: Stage to run in. Must exist in the including pipeline's `stages`.
    module:
      default: ":androidApp"
      description: Gradle path of the application module to assemble.
    build-type:
      default: debug
      options: [debug, release]
      description: Build type to assemble. A release build needs signing configuration on the runner.
    expire-in:
      default: 7 days
      description: How long to keep the APK. Release builds usually want longer than debug ones.
---

# Assembles an APK and keeps it as an artifact, so a reviewer can install the branch instead of
# taking a screenshot's word for it.
"$[[ inputs.job-name ]]":
  extends: .mrJobRules
  stage: $[[ inputs.stage ]]
  script:
    # Gradle's task is `assembleDebug`, the output directory is `debug`; the input stays lowercase so
    # both can be derived from it without the caller having to know which is which.
    - BUILD_TYPE='$[[ inputs.build-type ]]'
    - TASK_SUFFIX="$(printf '%s' "$BUILD_TYPE" | cut -c1 | tr '[:lower:]' '[:upper:]')$(printf '%s' "$BUILD_TYPE" | cut -c2-)"
    - ./gradlew "$[[ inputs.module ]]:assemble${TASK_SUFFIX}"
  artifacts:
    paths:
      - "**/build/outputs/apk/$[[ inputs.build-type ]]/*.apk"
    expire_in: $[[ inputs.expire-in ]]
